<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>filemanager (Vue 3)</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <script src="/harness/config.js"></script>
  </head>
  <body>
    <div class="container-fluid">
      <p class="small text-muted">Vue 3 app | <a href="/dev/legacy.html">legacy AngularJS</a> | <a href="#" id="harness-reset">reset mock data</a></p>
      <!-- FileManagerWidget renders only <hrzg-filemanager>; the two wrapper elements exist so the layout matches the legacy page -->
      <div>
        <div class="ng-cloak">
          <hrzg-filemanager></hrzg-filemanager>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      document.getElementById('harness-reset').addEventListener('click', function (e) {
        e.preventDefault();
        fetch('/mock/reset', { method: 'POST' }).then(function () { location.reload(); });
      });
    </script>
  </body>
</html>
