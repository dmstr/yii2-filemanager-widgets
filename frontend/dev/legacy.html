<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>filemanager (legacy AngularJS)</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/dev/legacy.less" />
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.min.js"></script>
    <!-- Same order as AfmBowerAsset, then AfmAsset -->
    <script src="/legacy/bower/angular.min.js"></script>
    <script src="/legacy/bower/angular-sanitize.min.js"></script>
    <script src="/legacy/bower/angular-translate.min.js"></script>
    <script src="/legacy/bower/ng-file-upload.min.js"></script>
    <script src="/legacy/bower/clipboard.min.js"></script>
    <script src="/legacy/bower/ngclipboard.min.js"></script>
    <script src="/legacy/dist/angular-filemanager.min.js"></script>
    <script src="/harness/config.js"></script>
    <script>
      // Same hook FileManagerWidget::setFileManagerConfig() registers.
      angular.module('FileManagerApp').config(['fileManagerConfigProvider', function (config) {
        var defaults = config.$get();
        config.set(angular.merge(defaults, window.fileManagerConfig));
      }]);
    </script>
  </head>
  <body>
    <div class="container-fluid">
      <p class="small text-muted"><a href="/dev/index.html">Vue 3 app</a> | legacy AngularJS | <a href="#" id="harness-reset">reset mock data</a></p>
      <div data-ng-app="FileManagerApp">
        <div class="ng-cloak">
          <angular-filemanager></angular-filemanager>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('harness-reset').addEventListener('click', function (e) {
        e.preventDefault();
        fetch('/mock/reset', { method: 'POST' }).then(function () { location.reload(); });
      });
    </script>
  </body>
</html>
